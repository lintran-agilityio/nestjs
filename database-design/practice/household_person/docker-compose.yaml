services:
  postgres:
    build:
      context: ./scripts/docker/postgres
      dockerfile: Dockerfile
    container_name: household_management_db
    environment:
      # PostgreSQL default settings
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

      # Application database settings
      DB_USER: household_management_user
      DB_PASSWORD: household_management_pass
      DB_NAME: household_management_db
    ports:
      - "5433:5432"
    volumes:
      # Persist data between container restarts
      - postgres_data:/var/lib/postgresql/data
      # Optional: Mount SQL scripts for easy access
      - ./scripts/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local