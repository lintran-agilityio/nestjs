version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: fake_social_db
    restart: alwaysgit
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5438:5432"
    volumes:
      - "postgres_data:/var/lib/postgresql/data"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user_social_network_api
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      NODE_ENV: production
    command: >
      sh -c "npx prisma migrate deploy && npm run start:prod"

volumes:
  postgres_data: